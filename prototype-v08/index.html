<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knowledge Village | 街づくり試作</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f0e4;color:#414638;font-family:system-ui,'Noto Sans JP',sans-serif}.wrap{max-width:1100px;margin:auto;padding:14px}h1{margin:5px 0;font-size:24px}p{line-height:1.6}header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.tag{background:#e0efd9;border-radius:30px;padding:7px 12px;font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(275px,1fr);gap:14px}.panel{background:#fffdf6;border-radius:18px;padding:15px;box-shadow:0 6px 24px #48391412}.scene{width:100%;border-radius:16px;background:linear-gradient(#a8d7ec,#d5ecce);touch-action:manipulation}.tiles polygon{stroke:#8cb877;stroke-width:.8;cursor:pointer}.tiles polygon:hover{filter:brightness(1.1)}.btn{border:1px solid #d1d7c5;background:white;padding:11px 12px;border-radius:11px;cursor:pointer;font-weight:700;color:#52644e}.btn.active{background:#d7ead0;border-color:#7db475}.btn:disabled{opacity:.4;cursor:not-allowed}.catalog{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.catalog .btn{text-align:left;font-size:13px}.controls{display:flex;gap:8px;flex-wrap:wrap}.muted{font-size:13px;color:#697567}.metrics{display:flex;gap:8px;flex-wrap:wrap}.metrics span{background:#eff4e7;padding:8px;border-radius:10px;font-size:13px}.notice{min-height:52px;background:#fff6d9;border-radius:12px;padding:12px;margin-top:10px}.subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.subjects button{min-width:0;font-size:12px}.locked{opacity:.6}.progress{height:8px;background:#e5e9dc;border-radius:8px;overflow:hidden;margin:5px 0 10px}.fill{height:100%;background:#84b97e}.scene text{user-select:none;pointer-events:none}.legend{margin-top:7px;font-size:12px;color:#5d6957}@media(max-width:750px){.layout{grid-template-columns:1fr}h1{font-size:21px}.panel{padding:12px}}
</style></head><body><div class="wrap"><header><div><h1>🏡 Knowledge Village</h1><div class="muted">絵本の村・街づくり実験室（独立サンプル）</div></div><span class="tag">本編のデータには影響しません</span></header><p class="muted">学んだ教科で村の個性が変化。建物を選んで好きな土地をタップ！ 大きな建物は連続したマスを使うよ。</p><div class="layout"><section class="panel"><div class="metrics"><span id="land"></span><span id="wood"></span><span id="books"></span><span id="friends"></span></div><svg id="map" class="scene" viewBox="0 0 640 510" role="img" aria-label="斜め上から見た街づくりマップ"></svg><div class="legend">🌿 明るい土地が建築可能な範囲。青い土地は未開拓。大きな建物には隣り合った空き地が必要。</div><div class="controls" style="margin-top:12px"><button class="btn" onclick="expand()">🌱 土地を拡張（開拓点30）</button><button class="btn" onclick="mode='move';render()">↔ 建物を移動</button><button class="btn" onclick="mode='demolish';render()">📦 建物をしまう</button></div><div class="notice" id="notice">建てたい建物を選んでね！</div></section><section class="panel"><h2 style="margin-top:0">🏗️ 建物をえらぼう</h2><div class="catalog" id="catalog"></div><h3>📚 学習の体験ボタン</h3><p class="muted">サンプルではボタンで学習成果を再現。実際の問題・習熟度判定とはまだ接続していません。</p><div class="subjects"><button class="btn" onclick="learn('math')">🧮 算数を学ぶ</button><button class="btn" onclick="learn('japanese')">📖 国語を学ぶ</button><button class="btn" onclick="learn('english')">🌍 英語を学ぶ</button></div><div id="skills"></div><h3>✨ 複合スキル施設</h3><p class="muted">複数教科の学習で解放。建物の場所は自分で決められるよ。</p><div id="special"></div><div class="controls"><button class="btn" onclick="resetDemo()">🔄 サンプルを初期化</button><a class="btn" href="../">本編に戻る</a></div></section></div></div><script>
const ITEMS={
house:{name:'小さな家',icon:'🏠',w:1,h:1,wood:8,books:0,friend:0,need:[]},
garden:{name:'お花畑',icon:'🌷',w:1,h:1,wood:3,books:0,friend:0,need:[]},
shop:{name:'雑貨屋',icon:'🏪',w:2,h:2,wood:22,books:0,friend:0,need:[]},
library:{name:'図書館',icon:'📚',w:3,h:2,wood:32,books:8,friend:0,need:['japanese']},
observatory:{name:'天文台',icon:'🔭',w:2,h:2,wood:25,books:6,friend:0,need:['math','japanese']},
cafe:{name:'国際カフェ',icon:'☕',w:2,h:2,wood:18,books:6,friend:3,need:['japanese','english']},
trading:{name:'貿易商店',icon:'⛵',w:2,h:2,wood:28,books:0,friend:4,need:['math','english']},
hall:{name:'交流ホール',icon:'🎪',w:3,h:3,wood:55,books:14,friend:8,need:['math','japanese','english']}
};
const N=10, colors=['#a8cd8b','#add393','#b7d99a','#a0c580'];let state={radius:2,wood:28,books:0,friend:0,points:0,skills:{math:0,japanese:0,english:0},buildings:[{type:'house',x:4,y:4}]},selected='house',mode='build',moving=null;
function key(x,y){return x+','+y}function unlocked(x,y){let lo=5-state.radius,hi=4+state.radius;return x>=lo&&x<=hi&&y>=lo&&y<=hi}
function origin(x,y){return [320+(x-y)*28,65+(x+y)*15]}function poly(x,y){const [cx,cy]=origin(x,y);return [cx+','+(cy-15),(cx+28)+','+cy,cx+','+(cy+15),(cx-28)+','+cy].join(' ')}
function occupied(ignore=-1){let m={};state.buildings.forEach((b,i)=>{if(i===ignore)return;const it=ITEMS[b.type];for(let dx=0;dx<it.w;dx++)for(let dy=0;dy<it.h;dy++)m[key(b.x+dx,b.y+dy)]=i});return m}
function fit(type,x,y,ignore=-1){let it=ITEMS[type],occ=occupied(ignore);for(let dx=0;dx<it.w;dx++)for(let dy=0;dy<it.h;dy++)if(!unlocked(x+dx,y+dy)||occ[key(x+dx,y+dy)]!==undefined)return false;return true}
function available(type){return ITEMS[type].need.every(k=>state.skills[k]>=2)}
function notify(s){document.getElementById('notice').textContent=s}
function placeAt(x,y){const occ=occupied(),at=occ[key(x,y)];if(mode==='demolish'){if(at===undefined){notify('建物をタップしてね');return}const b=state.buildings.splice(at,1)[0];const it=ITEMS[b.type];state.wood+=Math.floor(it.wood/2);notify(it.icon+' を収納したよ（木材を半分返却）');render();return}
if(mode==='move'){if(moving===null){if(at===undefined){notify('まず動かしたい建物をタップ');return}moving=at;notify('移動する先を選んでね');render();return}let b=state.buildings[moving];if(fit(b.type,x,y,moving)){b.x=x;b.y=y;moving=null;notify('✨ 建物を移動したよ！')}else notify('その場所には置けないよ。続けて移動先を選んでね');render();return}
const it=ITEMS[selected];if(!available(selected)){notify('🔒 必要な教科を学ぶと解放されるよ');return}if(!fit(selected,x,y)){notify('ここには置けないよ。続いた空き地を探してね');return}if(state.wood<it.wood||state.books<it.books||state.friend<it.friend){notify('材料が足りないよ。学習ボタンで増やそう！');return}state.wood-=it.wood;state.books-=it.books;state.friend-=it.friend;state.buildings.push({type:selected,x,y});notify('🎉 '+it.name+' が建ったよ！');render()}
function selectType(t){selected=t;mode='build';moving=null;notify(ITEMS[t].name+'：好きな空き地をタップしてね');render()}
function learn(k){state.skills[k]++;state.points+=12;if(k==='math'){state.wood+=17;state.books+=1}else if(k==='japanese'){state.books+=5;state.wood+=5}else{state.friend+=4;state.wood+=3;state.books+=1}const names={math:'算数',japanese:'国語',english:'英語'};notify('✨ '+names[k]+'の成果！ 村の可能性が広がったよ');render()}
function expand(){if(state.points<30){notify('開拓点が30必要だよ。学習で増やそう');return}if(state.radius>=5){notify('サンプルでは最大まで広がったよ！');return}state.points-=30;state.radius++;notify('🌱 土地が広がった！大きな建物も置いてみよう！');render()}
function resetDemo(){if(!confirm('サンプルを最初からやり直しますか？（本編には影響しません）'))return;state={radius:2,wood:28,books:0,friend:0,points:0,skills:{math:0,japanese:0,english:0},buildings:[{type:'house',x:4,y:4}]};selected='house';mode='build';moving=null;render();notify('サンプルを初期化したよ')}
function render(){
document.getElementById('land').textContent='🌱 土地 '+Math.min(N,2*state.radius)*Math.min(N,2*state.radius)+'マス / 開拓点'+state.points;document.getElementById('wood').textContent='🪵 '+state.wood;document.getElementById('books').textContent='📚 '+state.books;document.getElementById('friends').textContent='🌍 '+state.friend;
const svg=document.getElementById('map');let out='<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#b9e0ed"/><stop offset="1" stop-color="#e8efcf"/></linearGradient></defs><rect width="640" height="510" fill="url(#bg)"/><ellipse cx="320" cy="300" rx="300" ry="157" fill="#638a7680"/><g class="tiles">';
for(let diag=0;diag<2*N-1;diag++)for(let y=0;y<N;y++){let x=diag-y;if(x<0||x>=N)continue;let yes=unlocked(x,y),shade=colors[(x+y*3)%4];out+='<polygon points="'+poly(x,y)+'" fill="'+(yes?shade:'#9fc5c0')+'" opacity="'+(yes?1:.58)+'" onclick="placeAt('+x+','+y+')"/>'}
out+='</g>';
for(let b of state.buildings){let it=ITEMS[b.type],x=b.x+(it.w-1)/2,y=b.y+(it.h-1)/2,[cx,cy]=origin(x,y);let scale=Math.max(it.w,it.h);out+='<g style="pointer-events:none"><ellipse cx="'+cx+'" cy="'+(cy+12)+'" rx="'+(21*scale)+'" ry="'+(9*scale)+'" fill="#31543455"/><text x="'+cx+'" y="'+(cy+7)+'" font-size="'+(29+scale*9)+'" text-anchor="middle">'+it.icon+'</text><rect x="'+(cx-29)+'" y="'+(cy+12)+'" width="58" height="16" rx="7" fill="#fff9e9e8"/><text x="'+cx+'" y="'+(cy+23)+'" font-size="10" text-anchor="middle" fill="#45523e">'+it.name+'</text></g>'}
svg.innerHTML=out;
document.getElementById('catalog').innerHTML=Object.entries(ITEMS).map(([k,v])=>'<button class="btn '+(selected===k&&mode==='build'?'active ':'')+(!available(k)?'locked':'')+'" onclick="selectType(\''+k+'\')">'+v.icon+' '+v.name+'<br><small>'+v.w+'×'+v.h+' ／ 🪵'+v.wood+(v.books?' 📚'+v.books:'')+(v.friend?' 🌍'+v.friend:'')+(!available(k)?' 🔒':'')+'</small></button>').join('');
document.getElementById('skills').innerHTML=Object.entries({math:'🧮 算数',japanese:'📖 国語',english:'🌍 英語'}).map(([k,name])=>'<div class="muted" style="margin-top:11px">'+name+'：'+state.skills[k]+'回</div><div class="progress"><div class="fill" style="width:'+Math.min(100,state.skills[k]/2*100)+'%"></div></div>').join('');
document.getElementById('special').innerHTML=Object.values(ITEMS).filter(x=>x.need.length>=2).map(x=>'<div class="muted" style="padding:5px 0">'+x.icon+' '+x.name+' '+(x.need.every(k=>state.skills[k]>=2)?'✨ 解放済み':'🔒 '+x.need.map(k=>({math:'算数',japanese:'国語',english:'英語'})[k]).join('＋'))+'</div>').join('')
}
render();
</script></body></html>
