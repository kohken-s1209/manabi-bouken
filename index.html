<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#fff5df"><title>まなびぼうけん 0.2</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff7e6;color:#25344d;font-family:system-ui,"Noto Sans JP",sans-serif;line-height:1.7}.wrap{max-width:680px;margin:auto;padding:18px 15px 55px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1{font-size:26px;margin:0}small,.muted{color:#6a7280}.panel{background:white;border-radius:23px;padding:22px 18px;box-shadow:0 5px 22px #aa825322;margin:15px 0}.question{font-size:21px;font-weight:700;white-space:pre-line;line-height:1.9}.btn{border:0;border-radius:17px;background:#5c81df;color:white;padding:14px 18px;font-size:17px;font-weight:800;cursor:pointer;min-height:50px}.btn.alt{background:#fff0ce;color:#734d0b}.btn:disabled{opacity:.45;cursor:default}.choices{display:grid;gap:10px}.choices button{background:#f6f8ff;color:#213d76;border:2px solid #dfe5fa;border-radius:16px;padding:13px;text-align:left;font-size:17px;font-weight:700}.choices button.selected{background:#e5efff;border-color:#577fdb}.bar{background:#e8e8e8;border-radius:30px;overflow:hidden;height:10px;margin:10px 0 20px}.bar>div{background:#77b4a1;height:100%;transition:width .2s}.bubble{background:#eef9ef;padding:15px;border-radius:17px;white-space:pre-line;margin:14px 0}.error{background:#fff0e9}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stage{font-size:14px;font-weight:750;color:#527e76}.diagram{background:#f8f9ff;border-radius:16px;padding:15px;margin:15px 0}.strip{display:flex;height:42px;border-radius:9px;overflow:hidden;margin:9px 0;background:#e7e9ee}.piece{display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;min-width:0}.p1{background:#82bce8}.p2{background:#f5c577}.pill{display:inline-block;background:#fff0cc;padding:6px 10px;border-radius:99px;margin-right:5px}.hidden{display:none}.note{font-size:13px;color:#707987}.score{font-size:25px;font-weight:900}button:focus-visible{outline:3px solid #242424;outline-offset:2px}footer{text-align:center;font-size:12px;color:#7e7e7e;margin-top:35px}
</style></head><body><div class="wrap"><header><h1>🌈 まなびぼうけん</h1><span class="pill">Ver.0.2</span></header><div id="root"></div><footer>おためし版｜AIとは通信せず、この端末だけで動きます</footer></div><script>
const problems=[
{q:"73この シールと 48この シールが あります。\nあわせて 何こ ありますか？",kind:"combine",ask:"何を きかれているかな？",opts:["あわせた かず","のこった かず","ちがいの かず"],ok:0,a:73,b:48,op:"+",answer:121,why:"2つの シールを あわせるから、たし算だよ。"},
{q:"114ページの 本を 39ページ よみました。\nまだ よんでいないのは 何ページ？",kind:"remaining",ask:"何を きかれているかな？",opts:["よんだ ページ","のこりの ページ","ぜんぶの ページ"],ok:1,a:114,b:39,op:"-",answer:75,why:"ぜんぶ114ページの うち39ページを よんだから、のこりを さがすよ。"},
{q:"68円の えんぴつと 140円の ペンが あります。\nペンは 何円 たかいですか？",kind:"difference",ask:"何を くらべているかな？",opts:["2つを あわせた ねだん","ペンと えんぴつの ねだんの ちがい","ペン1本の ねだん"],ok:1,a:140,b:68,op:"-",answer:72,why:"140円と68円を くらべて、ちがう ぶんを さがすよ。"},
{q:"赤い リボンは 85cm。青い リボンは 赤い リボンより 27cm みじかいです。\n青い リボンは 何cm？",kind:"remaining",ask:"青い リボンは どっちかな？",opts:["赤より ながい","赤より みじかい","赤と おなじ"],ok:1,a:85,b:27,op:"-",answer:58,why:"青い リボンは 27cm みじかいので、85から27を ひくよ。"},
{q:"花が 36本 あります。赤い 花が 19本で、のこりは 白い 花です。\n白い 花は 何本？",kind:"remaining",ask:"36本は どんな かずかな？",opts:["ぜんぶの 花の かず","赤い 花だけの かず","白い 花だけの かず"],ok:0,a:36,b:19,op:"-",answer:17,why:"花は ぜんぶで36本。赤い19本を のぞいた ぶんが 白い 花だよ。"},
{q:"かずきさんは 42この どんぐりを もっています。ゆいさんは かずきさんより 18こ 多く もっています。\nゆいさんは 何こ？",kind:"combine",ask:"ゆいさんの かずは どうなるかな？",opts:["42より 少ない","42と おなじ","42より 多い"],ok:2,a:42,b:18,op:"+",answer:60,why:"ゆいさんは 18こ 多いから、42に18を たすよ。"}
];
let i=0,phase=0,choice=null,hints=0,results=[],tries=0,helped=0;
const root=document.getElementById("root");
function btn(label,fn,cls=""){return '<button class="btn '+cls+'" onclick="'+fn+'">'+label+'</button>'}
function diagram(p){let a=p.a,b=p.b,total=p.op==="+"?a+b:a;let first=p.kind==="difference"?p.b:(p.op==="+"?a:b);let second=Math.max(0,total-first);return '<div class="diagram"><div class="muted">📏 かずを ぼうで みてみよう</div><div class="strip"><span class="piece p1" style="flex:'+first+'">'+first+'</span><span class="piece p2" style="flex:'+Math.max(second,1)+'">'+(phase>=3?second:"？")+'</span></div><div class="note">ぜんぶ・一部分・ちがいを かんがえよう</div></div>'}
function render(){if(i>=problems.length)return end();let p=problems[i];let width=Math.round(i/problems.length*100);let content='<div class="stage">もんだい '+(i+1)+' / '+problems.length+'</div><div class="bar"><div style="width:'+width+'%"></div></div><section class="panel"><div class="question">'+p.q+'</div><div class="row" style="margin-top:12px">'+btn("🔊 よみあげ","speak()","alt")+'</div></section>';
if(phase===0)content+='<section class="panel"><strong>① お話を たしかめよう</strong><p>'+p.ask+'</p><div class="choices">'+p.opts.map((v,n)=>'<button onclick="pick('+n+')" class="'+(choice===n?"selected":"")+'">'+v+'</button>').join("")+'</div><div style="margin-top:15px">'+btn("こたえを たしかめる","checkMeaning()")+'</div>'+(tries?'<p class="bubble error">もう いちど お話を よんでみよう。わからなくても だいじょうぶ！</p>':'')+'</section>';
if(phase===1)content+='<section class="panel"><strong>② かずの かんけいを みよう</strong>'+diagram(p)+'<p>もんだいで きかれている かずは どこかな？</p><div class="bubble">💡 '+(p.kind==="difference"?"2つの かずを くらべたとき、どの くらい ちがうかな？":p.op==="-"?"ぜんぶの かずから、わかっている ぶんを のぞくと？":"はじめの かずに、あとから ふえた ぶんを あわせると？")+'</div>'+btn("しきへ すすむ","nextPhase()")+'</section>';
if(phase===2)content+='<section class="panel"><strong>③ どんな しきを つくる？</strong><p>たし算？ ひき算？</p><div class="choices"><button onclick="pick(0)" class="'+(choice===0?"selected":"")+'">'+p.a+' ＋ '+p.b+'</button><button onclick="pick(1)" class="'+(choice===1?"selected":"")+'">'+p.a+' − '+p.b+'</button></div><div class="row" style="margin-top:15px">'+btn("たしかめる","checkFormula()")+btn("💡 ヒント","showHint()","alt")+'</div>'+(tries?'<p class="bubble error">しきが ちがっても だいじょうぶ。何を もとめるか かんがえてみよう！</p>':'')+(helped?'<p class="bubble">'+p.why+'</p>':'')+'</section>';
if(phase===3)content+='<section class="panel"><strong>④ こたえは いくつ？</strong>'+diagram(p)+'<p>'+p.a+' '+p.op+' '+p.b+' = ？</p><input id="answer" type="number" inputmode="numeric" style="font-size:23px;width:100%;padding:12px;border-radius:13px;border:2px solid #d9def2" placeholder="こたえを いれてね"><div class="row" style="margin-top:15px">'+btn("こたえあわせ","checkAnswer()")+btn("💡 ヒント","showHint()","alt")+'</div>'+(tries?'<p class="bubble error">あと ちょっと！ゆっくり かんがえてみよう。</p>':'')+(helped?'<p class="bubble">'+p.why+'</p>':'')+'</section>';
if(phase===4)content+='<section class="panel"><div class="score">🌟 よく できたね！</div><p>'+p.a+' '+p.op+' '+p.b+' = <b>'+p.answer+'</b></p><p class="bubble">'+p.why+'</p>'+btn(i===problems.length-1?"けっかを みる":"つぎの もんだい","advance()")+'</section>';
root.innerHTML=content;}
function pick(n){choice=n;render()}
function checkMeaning(){if(choice===null)return;if(choice!==problems[i].ok){tries++;render();return}phase=1;choice=null;tries=0;render()}
function nextPhase(){phase=2;tries=0;choice=null;render()}
function checkFormula(){if(choice===null)return;let p=problems[i];if(choice!==(p.op==="+"?0:1)){tries++;render();return}phase=3;choice=null;tries=0;render()}
function checkAnswer(){let val=document.getElementById("answer").value;if(val==="")return;if(Number(val)!==problems[i].answer){tries++;render();return}phase=4;render()}
function showHint(){hints++;helped++;render()}
function advance(){results.push({problem:i+1,hints,meaningMisses:0});i++;phase=0;choice=null;hints=0;tries=0;helped=0;render()}
function end(){let h=results.reduce((s,r)=>s+r.hints,0);root.innerHTML='<section class="panel"><h2>🎉 ぜんぶ クリア！</h2><div class="score">🌟 6もん がんばったね！</div><p>ヒントを つかった かいすう：'+h+' かい</p><p>つぎも いっしょに かんがえよう！</p>'+btn("もう いちど","restart()")+'</section>'}
function restart(){i=0;phase=0;choice=null;hints=0;results=[];tries=0;helped=0;render()}
function speak(){if(!("speechSynthesis" in window)){alert("このブラウザは よみあげに たいおうしていません");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(problems[i].q);u.lang="ja-JP";u.rate=.85;speechSynthesis.speak(u)}
render();</script></body></html>
