<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7efe2"><title>まなびクラフト Ver.0.3</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f0e4;color:#334155;font-family:system-ui,"Noto Sans JP",sans-serif}.app{max-width:1000px;margin:auto;padding:14px 12px 45px}h1{margin:0;font-size:25px}h2{font-size:20px;margin:5px 0 12px}p{line-height:1.85}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.sub{font-size:12px;color:#64748b}.stocks{background:#fff;border-radius:20px;padding:9px 14px;font-weight:750}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.btn{border:0;padding:12px 14px;border-radius:14px;font-size:16px;font-weight:750;background:#587fbd;color:white;cursor:pointer;min-height:46px}.btn:disabled{opacity:.4}.nav .btn{background:#fff;color:#52657e;border:2px solid #e2e8f0}.nav .on{background:#d8eddd;border-color:#87bb94;color:#225c3f}.panel{background:#fff;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 4px 15px #6b534019}.note{background:#eff8ee;border-radius:14px;padding:12px;margin:12px 0;line-height:1.7}.warn{background:#fff1dd}.tools{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.tool{font-size:14px;background:#f1f5f9;color:#354c67;border:2px solid transparent;border-radius:12px;padding:10px;cursor:pointer}.tool.on{border-color:#598acc;background:#e4f0ff}.world{background:linear-gradient(150deg,#c5ecbc,#dff1cd);padding:7px;border-radius:17px;display:grid;grid-template-columns:repeat(8,1fr);gap:3px;max-width:600px;margin:auto}.room{background:#eee1c9;padding:7px;border-radius:17px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:440px;margin:auto}.tile{aspect-ratio:1;border:1px solid #96be89;border-radius:7px;background:#bce2a6;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,4vw,31px);cursor:pointer;padding:0}.room .tile{background:#f8eccf;border-color:#dcc6a4;font-size:clamp(20px,6vw,36px)}.tile:focus-visible,.btn:focus-visible,.tool:focus-visible{outline:3px solid #252d44}.stats{display:flex;gap:7px;flex-wrap:wrap}.tag{display:inline-block;border-radius:12px;background:#edf3fb;padding:7px 10px;font-size:13px}.choice{display:block;width:100%;text-align:left;margin:9px 0;background:#f0f4fc;color:#26486c;border:2px solid #d6e0f2}.question{font-size:20px;font-weight:700;line-height:1.95;white-space:pre-line}.bar{height:34px;display:flex;border-radius:9px;overflow:hidden;margin:12px 0}.bar span{display:grid;place-items:center;font-size:13px;font-weight:800;min-width:0}.sel{background:#dbf2de!important;border-color:#5da872!important}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.muted{color:#69788b;font-size:13px}.footer{font-size:12px;color:#748091;text-align:center;margin:25px 0}input{padding:11px;font-size:20px;width:140px;border:2px solid #bdd1e4;border-radius:12px}select{padding:9px;font-size:16px;border-radius:10px;border:1px solid #b1bfcd}#message{margin:9px 0}button{touch-action:manipulation}@media(min-width:750px){.twocol{display:grid;grid-template-columns:1.1fr 1fr;gap:14px}.panel{margin:10px 0}}@media(max-width:380px){.btn{font-size:14px;padding:10px 8px}.tool{padding:7px}}
</style></head><body><div class="app"><header class="top"><div><h1>🏡 まなびクラフト</h1><div class="sub">じぶんだけの まちを つくろう！ Ver.0.3</div></div><div id="stocks" class="stocks"></div></header><nav class="nav"><button class="btn" id="nav-town" onclick="tab('town')">🌳 まち</button><button class="btn" id="nav-room" onclick="tab('room')">🛋️ おへや</button><button class="btn" id="nav-study" onclick="tab('study')">📚 まなび</button></nav><main id="main"></main><div class="footer">テスト版｜じぶんで読んで考えよう｜このたんまつの中に保存｜個人情報の送信なし</div></div><script>
const key='manabicraft03';let defaults={wood:22,stone:12,crystal:0,world:{19:'house',27:'tree',36:'flower'},rooms:{19:{}},owned:{},used:0,cleared:0,history:[],homeStyle:0};
let s;try{s={...structuredClone(defaults),...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){s=JSON.parse(JSON.stringify(defaults))}
s.world=s.world||{};s.rooms=s.rooms||{};s.owned=s.owned||{};s.history=s.history||[];
let view='town',item='tree',roomItem='bed',house=19,selected=null,phase=0,hint=0,mistakes=0,problem=null,feedback='',difficulty=2,questCount=0;
const main=document.getElementById('main');
const catalog={house:{e:'🏠',name:'おうち',w:15,s:10},tree:{e:'🌳',name:'木',w:5,s:0},flower:{e:'🌷',name:'花',w:2,s:0},road:{e:'🟫',name:'道',w:0,s:2},shop:{e:'🏪',name:'おみせ',w:12,s:9},pond:{e:'💧',name:'いけ',w:0,s:7},fence:{e:'🚧',name:'さく',w:3,s:0},bench:{e:'🪑',name:'ベンチ',w:4,s:0},lamp:{e:'💡',name:'ランプ',w:3,s:2},cat:{e:'🐱',name:'ねこ',w:5,s:1},garden:{e:'🌼',name:'花だん',w:4,s:0},tower:{e:'🏰',name:'おしろ',w:20,s:17}};
const furniture={bed:{e:'🛏️',name:'ベッド',w:5,s:1},sofa:{e:'🛋️',name:'ソファ',w:6,s:1},desk:{e:'🪑',name:'つくえ',w:3,s:1},plant:{e:'🪴',name:'はちうえ',w:2,s:0},tv:{e:'📺',name:'テレビ',w:5,s:2},books:{e:'📚',name:'本だな',w:3,s:2},rug:{e:'🟪',name:'ラグ',w:2,s:0},piano:{e:'🎹',name:'ピアノ',w:12,s:3}};
function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){}}
function stocks(){document.getElementById('stocks').textContent='🪵 '+s.wood+'　🪨 '+s.stone+'　💎 '+s.crystal}
function show(m){feedback=m;draw()}
function tab(x){view=x;feedback='';draw()}
function action(sx){return '<button class="btn" onclick="'+sx+'">'}
function draw(){stocks();['town','room','study'].forEach(x=>document.getElementById('nav-'+x).classList.toggle('on',x===view));main.innerHTML=view==='town'?town():view==='room'?room():study()}
function tools(dict,active,handler){return '<div class="tools">'+Object.entries(dict).map(([k,v])=>'<button class="tool '+(active===k?'on':'')+'" onclick="'+handler+"('"+k+"')"+'">'+v.e+' '+v.name+'</button>').join('')+'<button class="tool '+(active==='erase'?'on':'')+'" onclick="'+handler+"('erase')"+'">🧹 かたづけ</button></div>'}
function setItem(k){item=k;draw()}function setRoomItem(k){roomItem=k;draw()}
function town(){return '<div class="twocol"><section class="panel"><h2>🌳 わたしの まち</h2><div class="world">'+Array.from({length:64},(_,i)=>'<button class="tile" aria-label="'+(i+1)+'ばんめのマス" onclick="place('+i+')">'+(catalog[s.world[i]]?.e||'')+'</button>').join('')+'</div><p class="muted">おうちを タップすると おへやに はいれるよ。</p></section><section class="panel"><h2>🔨 つくるものを えらぼう</h2><div class="stats"><span class="tag">🪵 もくざい</span><span class="tag">🪨 いし</span></div>'+tools(catalog,item,'setItem')+'<p class="muted">すきなマスを タップして つくろう！</p><div class="note">🏗️ たりない ざいりょうは まなびクエストで かんがえて あつめよう。</div>'+msg()+'</section></div>'}
function msg(){return feedback?'<div id="message" class="note '+(feedback.startsWith('⚠️')?'warn':'')+'">'+feedback+'</div>':''}
function place(i){let existing=s.world[i];if(item==='erase'){if(existing){let c=catalog[existing];s.wood+=Math.floor(c.w/2);s.stone+=Math.floor(c.s/2);delete s.world[i];delete s.rooms[i];save();show('🧹 かたづけたよ！ ざいりょうが すこし もどったよ。')}else show('ここには 何もないよ');return}
if(existing==='house'&&item==='house'){house=i;view='room';feedback='';draw();return}
if(existing){show('⚠️ ここには もう ものが あるよ。べつのマスを えらんでね。');return}
let c=catalog[item];if(s.wood<c.w||s.stone<c.s){selected={kind:item,missingWood:Math.max(0,c.w-s.wood),missingStone:Math.max(0,c.s-s.stone)};view='study';startQuest();return}
s.wood-=c.w;s.stone-=c.s;s.world[i]=item;if(item==='house')s.rooms[i]={};save();show(c.e+' '+c.name+'を つくったよ！')}
function room(){let houses=Object.keys(s.world).filter(i=>s.world[i]==='house');if(!houses.length)return '<section class="panel"><h2>🏡 おうちが まだ ないよ</h2>'+action("tab('town')")+'まちにもどる</button></section>';if(!houses.includes(String(house)))house=Number(houses[0]);let cells=s.rooms[house]||(s.rooms[house]={});return '<div class="twocol"><section class="panel"><h2>🛋️ おへやづくり</h2><div class="row"><span>おうちを えらぶ：</span><select onchange="house=Number(this.value);draw()">'+houses.map(k=>'<option '+(Number(k)===house?'selected':'')+' value="'+k+'">おうち '+(Number(k)+1)+'</option>').join('')+'</select></div><div class="room" style="margin-top:16px">'+Array.from({length:25},(_,i)=>'<button class="tile" onclick="furnish('+i+')">'+(furniture[cells[i]]?.e||'')+'</button>').join('')+'</div></section><section class="panel"><h2>🎨 すきな かぐを えらぼう</h2>'+tools(furniture,roomItem,'setRoomItem')+'<p class="muted">かぐは いちど てにいれたら 何度でも うごかせるよ。おなじかぐを ふやすときは ざいりょうが ひつようだよ。</p>'+msg()+'</section></div>'}
function furnish(i){let cells=s.rooms[house]||(s.rooms[house]={});let old=cells[i];if(roomItem==='erase'){if(old){delete cells[i];s.owned[old]=(s.owned[old]||0)+1;save();show('🎒 かぐを しまったよ。また つかえるよ！')}else show('ここには なにも ないよ');return}
if(old){show('⚠️ ここには かぐが あるよ。さきに かたづけてね。');return}
let c=furniture[roomItem];if(s.owned[roomItem]>0){s.owned[roomItem]--}else if(s.wood>=c.w&&s.stone>=c.s){s.wood-=c.w;s.stone-=c.s}else{selected={kind:roomItem,missingWood:Math.max(0,c.w-s.wood),missingStone:Math.max(0,c.s-s.stone)};view='study';startQuest();return}
cells[i]=roomItem;save();show(c.e+' '+c.name+'を おいたよ！')}
const tasks=[
{a:45,b:27,op:'-',type:'left',q:'おうちを つくるには 木の いたが 45まい ひつようです。\nいま 27まい あります。\nあと 何まい ひつよう？',meaning:['これから ふえる いた','まだ たりない いた','ぜんぶの いた'],mi:1,why:'ぜんぶ45まいから、ある27まいを のぞくと たりない いたが わかるよ。'},
{a:68,b:39,op:'-',type:'left',q:'いしの ブロックが 68こ ありました。\n39こ つかいました。\nのこりは 何こ？',meaning:['つかった かず','のこっている かず','もともとの かず'],mi:1,why:'もともと68こ。39こ つかったので、のこりを ひき算で しらべるよ。'},
{a:36,b:18,op:'+',type:'more',q:'おにわに 花が 36本 あります。\n新しく 18本 うえました。\nぜんぶで 何本？',meaning:['ぜんぶの 花','うえた 花だけ','へった 花'],mi:0,why:'36本に18本を あわせると、花は ふえるよ。'},
{a:94,b:57,op:'-',type:'gap',q:'大きな おうちは 94この ブロック、\n小さな おうちは 57この ブロックを つかいます。\nちがいは 何こ？',meaning:['ブロックの ごうけい','ブロックの ちがい','小さな おうちだけ'],mi:1,why:'ちがいは 94こと57こを くらべて、多い ぶんを もとめるよ。'},
{a:48,b:26,op:'+',type:'more',q:'木の ブロックが 48こ あります。\nほかに 26こ とどきました。\nいま 何こ ありますか？',meaning:['とどいた かずだけ','ぜんぶの かず','のこりの かず'],mi:1,why:'48こに26こ とどいたので、たし算だよ。'},
{a:125,b:78,op:'-',type:'gap',q:'赤い へやの かざりは 125こ、青い へやは 78こ。\n赤い へやは 青い へやより 何こ 多い？',meaning:['2つを あわせた かず','青い へやだけ','2つの かずの ちがい'],mi:2,why:'どれだけ多いかを 知るには、2つの かずの ちがいを しらべるよ。'},
{a:82,b:37,op:'-',type:'left',q:'おみせを かざるのに 82この ライトが ひつよう。\nもう 37こ つけました。\nあと 何こ つける？',meaning:['まだ ひつような かず','すべての かず','つけた かず'],mi:0,why:'ぜんぶ82こ、つけたのは37こ。のこりを もとめるよ。'},
{a:58,b:24,op:'+',type:'more',q:'おにわの 赤い レンガは 58こ。\n青い レンガは 赤い レンガより 24こ 多いです。\n青い レンガは 何こ？',meaning:['赤い レンガ','青い レンガ','ぜんぶ あわせた レンガ'],mi:1,why:'青い レンガは赤い58こより24こ多いので、たすよ。'}
];
function pickDifficulty(v){difficulty=Number(v);startQuest()}
function startQuest(){problem=tasks[(s.cleared+questCount)%tasks.length];phase=0;hint=0;mistakes=0;feedback='';draw()}
function compute(){return problem.a+(problem.op==='+'?problem.b:-problem.b)}
function study(){if(!problem)problem=tasks[s.cleared%tasks.length];let total=compute();let base=difficulty===1?6:difficulty===2?10:15;let prize=Math.max(2,base-hint*3-mistakes*2);let target=selected?(catalog[selected.kind]||furniture[selected.kind]):null;let status='<section class="panel"><h2>📚 まなびクエスト</h2><div class="row"><label>むずかしさ <select onchange="pickDifficulty(this.value)"><option value="1" '+(difficulty===1?'selected':'')+'>⭐ やさしい</option><option value="2" '+(difficulty===2?'selected':'')+'>⭐⭐ ふつう</option><option value="3" '+(difficulty===3?'selected':'')+'>⭐⭐⭐ チャレンジ</option></select></label><span class="tag">基本報酬 🪵 '+base+'</span></div><p class="muted">ヒント1回で木材 -3、まちがい1回で -2（さいてい2こ）。あきらめずに とけたら かならず もらえるよ。</p>'+(target?'<div class="note">🏗️ '+target.e+target.name+'の ざいりょうが たりないよ！<br>木材あと '+selected.missingWood+'こ、石材あと '+selected.missingStone+'こ。もんだいを といて あつめよう！</div>':'')+'</section>';if(phase===4)return status+'<section class="panel"><h2>🎉 ミッション クリア！</h2><div class="note">💡 '+problem.why+'</div><p>正しいしき：'+problem.a+problem.op+problem.b+' = '+total+'</p><p><strong>✨ 木材 +'+prize+'、石材 +'+Math.max(1,Math.floor(prize/3))+'</strong></p><p>たしかめた 数「'+total+'」が、まちの ものづくりに つながったよ！</p>'+action('claim('+prize+')')+'ざいりょうを うけとる</button></section>';let stage=['① お話を 理解しよう','② かずの かんけい','③ しきを えらぼう','④ こたえを だそう'];let content=status+'<section class="panel"><h2>'+stage[phase]+'</h2><div class="question">'+problem.q+'</div>';if(phase===0)content+='<p><strong>何を しらべる お話かな？</strong></p>'+problem.meaning.map((m,j)=>'<button class="btn choice" onclick="meaning('+j+')">'+m+'</button>').join('');if(phase===1){let part=problem.op==='+'?problem.a:problem.b;content+='<p>かずを ぼうで たしかめよう</p><div class="bar"><span style="background:#91c5ea;flex:'+part+'">'+part+'</span><span style="background:#f2c982;flex:'+Math.max(1,problem.op==='+'?problem.b:total)+'">？</span></div><div class="note">💡 '+(problem.op==='+'?'2つの かずを あわせたら、ぜんぶは どうなる？':'ぜんぶの うち、わかっている ぶんを かんがえてみよう。')+'</div>'+action('phase=2;draw()')+'しきに すすむ →</button>'}if(phase===2)content+='<p>どちらの しきかな？</p><button class="btn choice" onclick="formula(0)">'+problem.a+' ＋ '+problem.b+'</button><button class="btn choice" onclick="formula(1)">'+problem.a+' − '+problem.b+'</button>';if(phase===3)content+='<p>'+problem.a+' '+problem.op+' '+problem.b+' = ？</p><input id="num" type="number" inputmode="numeric" placeholder="こたえ"><button class="btn" onclick="check()">こたえあわせ</button>';content+='<div class="row" style="margin-top:14px">'+(phase!==1?action('hintMe()')+'💡 ヒントをみる（報酬 -3）</button>':'')+'<span class="tag">もらえる木材 '+prize+'</span></div>'+msg()+'</section>';return content}
function meaning(j){if(j!==problem.mi){mistakes++;show('⚠️ もういちど、さいごの「何を？」を よんでみよう。');return}phase=1;feedback='';draw()}
function formula(j){if(j!==(problem.op==='+'?0:1)){mistakes++;show('⚠️ こたえの かずは、大きくなるかな？ 小さくなるかな？');return}phase=3;feedback='';draw()}
function check(){let el=document.getElementById('num');if(!el||el.value==='')return;if(Number(el.value)!==compute()){mistakes++;show('⚠️ おしい！ ゆっくり もういちど けいさんしてみよう。');return}phase=4;feedback='';draw()}
function hintMe(){hint++;show('💡 '+(phase===0?'「何を きかれているか」に せんを ひく つもりで よんでみよう。':phase===2?problem.why:'いちのくらい と じゅうのくらいに わけて、ゆっくり けいさんしよう。'))}
function claim(prize){s.wood+=prize;s.stone+=Math.max(1,Math.floor(prize/3));s.cleared++;s.history.push({at:new Date().toISOString(),question:problem.q,level:difficulty,hint,mistakes,reward:prize});save();let name=selected?(catalog[selected.kind]||furniture[selected.kind]):null;questCount++;let text='🌟 木材 '+prize+'こ と 石材 '+Math.max(1,Math.floor(prize/3))+'こを てにいれた！';if(name)text+=' '+name.name+'の ざいりょうを あつめよう！';selected=null;view='town';feedback=text;startQuest();view='town';feedback=text;draw()}
draw();</script></body></html>
