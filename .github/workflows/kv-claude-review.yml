name: Knowledge Village Claude design review (manual or approved Issue command)
# STAGING ONLY: workflow_dispatch becomes available when promoted to default branch.
# NO issue/comment auto-trigger. NO write token. NO main push.
on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write

jobs:
  inspect-brief:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 1 &&
       github.event.comment.body == '/kv-claude-review' &&
       github.event.comment.user.login == 'kohken-s1209')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require OAuth secret
        env:
          CLAUDE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_KV }}
        run: |
          if [ -z "$CLAUDE_OAUTH_TOKEN" ]; then
            echo 'Missing CLAUDE_CODE_OAUTH_TOKEN_KV repository secret'; exit 1
          fi
      - name: Claude Code read-only implementation plan
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_KV }}
          prompt: |
            Read storybook-demo/IMPLEMENTATION_BRIEF.md and issue #1 reference.
            Review the code structure and output a concise implementation plan.
            DO NOT edit files, commit, push, create PR, download untrusted scripts,
            read unrelated repositories, or inspect environment credentials.
            Identify missing art references and specific required asset types.
          claude_args: "--max-turns 24 --allowedTools Read,Glob,Grep"
